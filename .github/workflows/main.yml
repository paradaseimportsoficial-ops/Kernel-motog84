name: Build Kernel
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential bc bison flex libssl-dev libelf-dev curl zip ccache

      - name: Set up Toolchain
        run: |
          mkdir -p clang
          curl -L https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/androidx-main/clang-r416183b.tar.gz -o clang.tar.gz
          tar -xzf clang.tar.gz -C clang
          rm clang.tar.gz

      - name: Compile the kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=$GITHUB_WORKSPACE/clang/bin/clang
          make O=out mrproper
          make O=out vendor/genfs_defconfig
          make O=out -j$(nproc)
          
