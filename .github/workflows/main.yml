name: Build Kernel
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential bc bison flex libssl-dev libelf-dev curl zip ccache

      - name: Set up Toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/aarch64-elf-gcc.git clang

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 https://github.com/MotorolaMobilityLLC/kernel-msm-lahaina.git -b android-13-moto kernel_src

      - name: Compile the kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-elf-
          cd kernel_src
          make mrproper
          make vendor/genfs_defconfig
          make -j$(nproc)
          
