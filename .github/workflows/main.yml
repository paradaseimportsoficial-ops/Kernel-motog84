name: ZIP TWRP - Tecnico Root V1
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Testar alteracao limitada ao nome
        run: |
          python3 -m unittest discover -s tests -v
          bash -n installer/anykernel.sh
      - name: Baixar instalador AnyKernel3 fixado
        run: |
          git init AnyKernel3
          git -C AnyKernel3 remote add origin https://github.com/osm0sis/AnyKernel3.git
          git -C AnyKernel3 fetch --depth=1 origin 41f04bdb4ee30a44e429c2c1131d5e8bb32b15f1
          git -C AnyKernel3 checkout --detach FETCH_HEAD
          test "$(git -C AnyKernel3 rev-parse HEAD)" = 41f04bdb4ee30a44e429c2c1131d5e8bb32b15f1
      - name: Gerar ZIP sem imagem ou credenciais pessoais
        run: |
          python3 scripts/build_zip.py --anykernel AnyKernel3 --output dist/MotoG84-Tecnico-Root-V1-renomeador-TWRP.zip
          cd dist
          sha256sum *.zip > SHA256SUMS
      - name: Publicar ZIP instalavel e checksum
        uses: actions/upload-artifact@v4
        with:
          name: MotoG84-Tecnico-Root-V1-TWRP
          path: dist/
          if-no-files-found: error
