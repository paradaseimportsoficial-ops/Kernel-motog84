name: Build Kernel
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential bc bison flex libssl-dev libelf-dev curl zip ccache

      - name: Set up Toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/aarch64-elf-gcc.git -b main clang

      - name: Compile the kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=$GITHUB_WORKSPACE/clang/bin/aarch64-elf-
          make O=out mrproper
          make O=out vendor/genfs_defconfig
          make O=out -j$(nproc)
          
